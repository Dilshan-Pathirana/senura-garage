<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dilini Motors – Jeep Modification Garage in Nittambuwa, Sri Lanka. Premium Jeep modifications, custom off-road builds, performance upgrades, and mechanical repairs."
    />
    <title>Dilini Motors – Jeep Modification Garage</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA fallback: if redirected from /404.html we land on /?p=<originalPath>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (!p) return;
        params.delete('p');
        var newPath = decodeURIComponent(p);
        var newSearch = params.toString();
        var url = window.location.pathname.replace(/\/$/, '') + newPath;
        if (newSearch) url += '?' + newSearch;
        window.history.replaceState(null, '', url);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
