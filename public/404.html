<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback.
      // Redirect /<repo>/<path> to /<repo>/?p=<path>
      (function () {
        var l = window.location;
        var base = l.pathname.split('/').slice(0, 2).join('/');
        var path = l.pathname.substring(base.length);
        var target = base + '/?p=' + encodeURIComponent(path + l.search + l.hash);
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
